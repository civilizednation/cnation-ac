<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>cnation Audio Compressor</title>
  <meta name="description" content="MP3를 고효율 WebM(Opus)으로 일괄 변환하고 원본과 바로 비교해 들어보세요.">
  <meta property="og:title" content="cnation Audio Compressor">
  <meta property="og:description" content="MP3 → WebM(Opus) 일괄 변환 · 원본 비교 듣기">
  <meta name="theme-color" content="#0e131c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="cnation A/C">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <script src="vendor/webm-muxer.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <style>
    :root {
      --bg: #0e131c;
      --card: #171e2b;
      --card-2: #1e2737;
      --line: #273247;
      --text: #eef2f8;
      --muted: #8b97ab;
      --accent: #f5b942;
      --accent-dark: #e09f22;
      --accent-ink: #2a1c00;
      --accent-soft: rgba(245, 185, 66, .14);
      --orig: #5fb4ff;
      --orig-soft: rgba(95, 180, 255, .14);
      --danger: #ff6b6b;
      --radius: 18px;
      --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 10px 30px rgba(0, 0, 0, .25);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 420px at 0% -10%, rgba(245, 185, 66, .13) 0%, transparent 60%),
        radial-gradient(800px 480px at 110% 0%, rgba(95, 180, 255, .10) 0%, transparent 55%),
        var(--bg);
      background-attachment: fixed;
      -webkit-tap-highlight-color: transparent;
      word-break: keep-all;
    }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
    button:disabled { cursor: not-allowed; }
    .hidden { display: none !important; }

    .wrap { max-width: 680px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }

    header { display: flex; align-items: center; gap: 12px; padding: 4px 2px 18px; }
    header img { width: 46px; height: 46px; border-radius: 12px; box-shadow: 0 0 0 1px rgba(245, 185, 66, .25), 0 6px 18px rgba(245, 185, 66, .18); }
    header h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
    header h1 em { font-style: normal; color: var(--accent); }
    header p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px; }

    .drop { text-align: center; padding: 28px 18px; border: 2px dashed #34405a; background: rgba(23, 30, 43, .7); transition: border-color .15s, background .15s; }
    .drop.over { border-color: var(--accent); background: var(--accent-soft); }
    .drop p { margin: 10px 0 0; font-size: 13px; color: var(--muted); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 20px; border-radius: 14px; font-size: 15px; font-weight: 700; transition: background .15s, opacity .15s, transform .05s; }
    .btn:active:not(:disabled) { transform: scale(.98); }
    .btn svg { width: 18px; height: 18px; }
    .btn.primary { background: var(--accent); color: var(--accent-ink); }
    .btn.primary:hover:not(:disabled) { background: #ffc85e; }
    .btn.soft { background: var(--card-2); color: var(--text); border: 1px solid var(--line); }
    .btn.soft:hover:not(:disabled) { border-color: #3a4864; }
    .btn:disabled { opacity: .35; }

    .label { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
    .seg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 4px; background: #0f1520; border: 1px solid var(--line); border-radius: 14px; }
    .seg button { height: 50px; padding: 0; border-radius: 10px; font-size: 14px; font-weight: 700; color: var(--muted); line-height: 1.15; }
    .seg button small { display: block; font-size: 10.5px; font-weight: 600; opacity: .8; }
    .seg button.on { background: var(--accent); color: var(--accent-ink); }
    .hint { margin: 8px 2px 0; font-size: 12.5px; color: var(--muted); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }

    .progress { margin-top: 14px; }
    .progress .track { height: 8px; border-radius: 99px; background: #0f1520; overflow: hidden; }
    .progress .bar { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #ffd27a, var(--accent)); transition: width .2s; }
    .progress .ptext { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
    .progress .ptext span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .list-head h2 { margin: 0; font-size: 15px; font-weight: 800; }
    .list-head h2 span { color: var(--accent); margin-left: 4px; }
    .link { font-size: 13px; color: var(--muted); padding: 6px 4px; }
    .link:hover { color: var(--danger); }
    .empty { margin: 14px 0 4px; text-align: center; font-size: 13px; color: var(--muted); }

    .item { padding: 12px 0; border-top: 1px solid var(--line); }
    .item:first-child { border-top: 0; }
    .item.active .name { color: var(--accent); }
    .item-top { display: flex; align-items: center; gap: 8px; }
    .name { flex: 1; min-width: 0; font-size: 14.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .x { width: 30px; height: 30px; border-radius: 8px; color: #6d7a90; display: grid; place-items: center; flex-shrink: 0; }
    .x:hover { color: var(--danger); background: rgba(255, 107, 107, .12); }
    .x svg { width: 16px; height: 16px; }
    .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 4px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .badge { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--card-2); color: var(--muted); }
    .badge.ok { background: rgba(74, 222, 128, .14); color: #6ee79a; }
    .badge.err { background: rgba(255, 107, 107, .14); color: var(--danger); }
    .badge.run { background: var(--accent-soft); color: var(--accent); }
    .mini { height: 4px; border-radius: 99px; background: #0f1520; overflow: hidden; margin-top: 8px; }
    .mini div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
    .item-actions { display: flex; gap: 8px; margin-top: 10px; }
    .item-actions .btn { height: 36px; padding: 0 14px; font-size: 13.5px; border-radius: 10px; }
    .item-actions .btn svg { width: 16px; height: 16px; }

    /* ---- Compare player ---- */
    .player { position: sticky; bottom: calc(10px + env(safe-area-inset-bottom)); background: #182131; border-color: #35425c; box-shadow: 0 -4px 30px rgba(0, 0, 0, .45); }
    .pl-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .pl-head h2 { margin: 0; font-size: 15px; font-weight: 800; flex-shrink: 0; }
    .pl-head span { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .now { --c: var(--muted); --soft: var(--card-2); display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--soft); border: 2px solid var(--c); transition: background .15s, border-color .15s; }
    .now.idle { border-color: var(--line); }
    .now.orig { --c: var(--orig); --soft: var(--orig-soft); }
    .now.conv { --c: var(--accent); --soft: var(--accent-soft); }
    .now .eq { display: flex; align-items: flex-end; gap: 3px; width: 22px; height: 22px; flex-shrink: 0; }
    .now .eq i { flex: 1; height: 30%; border-radius: 2px; background: var(--c); }
    .now.playing .eq i { animation: eq .9s ease-in-out infinite; }
    .now.playing .eq i:nth-child(2) { animation-delay: -.3s; }
    .now.playing .eq i:nth-child(3) { animation-delay: -.6s; }
    @keyframes eq { 0%, 100% { height: 25%; } 50% { height: 100%; } }
    .now-text { flex: 1; min-width: 0; }
    .now-text small { display: block; font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
    .now-text b { display: block; font-size: 20px; font-weight: 800; color: var(--c); line-height: 1.25; }
    .now.idle .now-text b { color: var(--text); }
    .now-side { text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }
    .now-side b { display: block; font-size: 15px; color: var(--text); }
    .seg-bar { height: 4px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; margin-top: 8px; }
    .seg-bar div { height: 100%; width: 0; background: var(--accent); }
    .seg-bar.orig div { background: var(--orig); }

    .ab { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .ab button { padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); text-align: left; background: var(--card-2); transition: border-color .12s, background .12s, opacity .12s; }
    .ab button b { display: block; font-size: 14px; }
    .ab button small { display: block; margin-top: 1px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .ab button[data-src="orig"] b { color: var(--orig); }
    .ab button[data-src="conv"] b { color: var(--accent); }
    .ab button[data-src="orig"].on { border-color: var(--orig); background: var(--orig-soft); }
    .ab button[data-src="conv"].on { border-color: var(--accent); background: var(--accent-soft); }
    .ab.locked button { opacity: .55; pointer-events: none; }

    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; margin: 10px 0 0; background: transparent; --p: 0%; --rs: 0%; --re: 0%; }
    input[type=range]::-webkit-slider-runnable-track {
      height: 6px; border-radius: 99px;
      background:
        linear-gradient(90deg, var(--accent) var(--p), transparent var(--p)),
        linear-gradient(90deg, transparent var(--rs), rgba(255, 255, 255, .35) var(--rs), rgba(255, 255, 255, .35) var(--re), transparent var(--re)),
        #2a3549;
    }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -6px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); box-shadow: 0 1px 4px rgba(0, 0, 0, .4); }
    input[type=range]::-moz-range-track { height: 6px; border-radius: 99px; background: #2a3549; }
    input[type=range]::-moz-range-progress { height: 6px; border-radius: 99px; background: var(--accent); }
    input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); }
    .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .pl-ctrl { display: flex; align-items: center; justify-content: center; gap: 22px; margin-top: 2px; }
    .icon-btn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: #6d7a90; }
    .icon-btn svg { width: 20px; height: 20px; }
    .icon-btn.on { color: var(--accent); background: var(--accent-soft); }
    .play { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 18px rgba(245, 185, 66, .3); }
    .play:disabled { opacity: .4; }
    .play svg { width: 24px; height: 24px; }

    .alt { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
    .alt-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .alt-head b { font-size: 14px; }
    .alt-head span { font-size: 12px; color: var(--muted); }
    .alt-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .alt-btns button { height: 42px; border-radius: 12px; font-size: 15px; font-weight: 800; background: var(--card-2); border: 1px solid var(--line); }
    .alt-btns button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .alt-btns button:disabled { opacity: .4; }

    #toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 12px; background: #eef2f8; color: #0e131c; font-size: 13.5px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="apple-touch-icon.png" alt="">
      <div>
        <h1>cnation <em>Audio Compressor</em></h1>
        <p>MP3 → WebM 일괄 변환 · 원본 비교 듣기</p>
      </div>
    </header>

    <main>
      <section class="card drop" id="drop">
        <input type="file" id="file-input" multiple accept="audio/mpeg,audio/mp3,.mp3,audio/*" hidden>
        <button class="btn primary" id="pick">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          MP3 파일 추가
        </button>
        <p>여러 파일을 한 번에 선택하거나 여기로 끌어다 놓으세요</p>
      </section>

      <section class="card">
        <div class="label">WebM 음질</div>
        <div class="seg" id="bitrates">
          <button data-kbps="32">32k<small>초경량</small></button>
          <button data-kbps="48">48k<small>경량</small></button>
          <button data-kbps="64">64k<small>기본</small></button>
          <button data-kbps="96">96k<small>고음질</small></button>
          <button data-kbps="128">128k<small>최고</small></button>
        </div>
        <p class="hint" id="br-hint"></p>
        <div class="actions">
          <button class="btn primary" id="convert" disabled>변환 시작</button>
          <button class="btn soft" id="zip" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>
            ZIP 저장
          </button>
        </div>
        <div class="progress hidden" id="progress">
          <div class="track"><div class="bar" id="progress-bar"></div></div>
          <div class="ptext"><span id="progress-text"></span><span id="progress-pct">0%</span></div>
        </div>
      </section>

      <section class="card">
        <div class="list-head">
          <h2>파일<span id="count">0</span></h2>
          <button class="link" id="clear">모두 지우기</button>
        </div>
        <div id="list"></div>
        <p class="empty" id="empty">추가된 파일이 없습니다</p>
      </section>

      <section class="card player hidden" id="player">
        <div class="pl-head">
          <h2>비교 듣기</h2>
          <span id="pl-name"></span>
          <button class="x" id="pl-close" aria-label="닫기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>

        <div class="now idle" id="now" aria-live="polite">
          <div class="eq"><i></i><i></i><i></i></div>
          <div class="now-text">
            <small id="now-label">일시정지</small>
            <b id="now-src">WebM</b>
          </div>
          <div class="now-side hidden" id="now-side"><b id="now-round"></b><span id="now-range"></span></div>
        </div>
        <div class="seg-bar hidden" id="seg-bar"><div id="seg-fill"></div></div>

        <div class="ab" id="ab">
          <button data-src="orig"><b>원본 MP3</b><small id="ab-orig"></small></button>
          <button data-src="conv" class="on"><b>WebM</b><small id="ab-conv"></small></button>
        </div>

        <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="재생 위치">
        <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
        <div class="pl-ctrl">
          <button class="icon-btn" id="loop" aria-label="반복">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 013-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 01-3 3H3"/></svg>
          </button>
          <button class="play" id="play" aria-label="재생" disabled>
            <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 001.5.86l10.5-6.5a1 1 0 000-1.72L9.5 4.64A1 1 0 008 5.5z"/></svg>
          </button>
          <span class="icon-btn" aria-hidden="true"></span>
        </div>

        <div class="alt">
          <div class="alt-head"><b>번갈아 듣기</b><span id="alt-hint">시작 위치를 정하고 구간 길이를 누르세요</span></div>
          <div class="alt-btns" id="alt-btns">
            <button data-len="3">3초</button>
            <button data-len="5">5초</button>
            <button data-len="10">10초</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" role="status"></div>

  <script>
  (() => {
    'use strict';

    const $ = (id) => document.getElementById(id);
    const BITRATES = {
      32: '초경량 · 단순한 곡이나 용량이 가장 중요할 때',
      48: '경량 · 용량을 더 줄이고 싶을 때 (고음에서 약간의 잡음)',
      64: '모바일 게임 BGM 기본 · 잡음 없이 깔끔한 음질 · 권장',
      96: '고음질 · 원본과 구분하기 어려움',
      128: '최고 음질 · 용량 절감 효과는 작음'
    };
    const ICON_PLAY = '<path d="M8 5.5v13a1 1 0 001.5.86l10.5-6.5a1 1 0 000-1.72L9.5 4.64A1 1 0 008 5.5z"/>';
    const ICON_PAUSE = '<rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/>';
    const ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

    let kbps = 64;
    let items = [];
    let converting = false;

    /* ---------- Audio context (shared) ---------- */
    let ctx = null;
    function audioCtx() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        ctx = new AC();
      }
      // Must run inside a user gesture on iOS — call before any await.
      if (ctx.state !== 'running') ctx.resume().catch(() => {});
      return ctx;
    }
    // Play through the iPhone silent switch (Safari 16.4+).
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}

    function decodeWith(context, arrayBuffer) {
      return new Promise((resolve, reject) => {
        const p = context.decodeAudioData(arrayBuffer, resolve, reject);
        if (p && p.then) p.then(resolve, reject);
      });
    }

    /* ---------- Helpers ---------- */
    function fmtSize(bytes) {
      if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + 'MB';
      return Math.max(1, Math.round(bytes / 1024)) + 'KB';
    }
    function fmtTime(sec) {
      sec = Math.max(0, sec || 0);
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return m + ':' + String(s).padStart(2, '0');
    }
    function esc(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function baseName(name) { return name.replace(/\.[^/.]+$/, ''); }

    let toastTimer = null;
    function toast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    function download(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }

    /* ---------- Bitrate selector ---------- */
    function renderBitrate() {
      document.querySelectorAll('#bitrates button').forEach((b) => {
        b.classList.toggle('on', Number(b.dataset.kbps) === kbps);
      });
      $('br-hint').textContent = BITRATES[kbps];
      updateButtons();
    }
    $('bitrates').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b || converting) return;
      kbps = Number(b.dataset.kbps);
      renderBitrate();
    });

    /* ---------- Adding files ---------- */
    const input = $('file-input');
    const drop = $('drop');
    $('pick').addEventListener('click', () => input.click());
    input.addEventListener('change', () => {
      addFiles(Array.from(input.files || []));
      input.value = '';
    });
    ['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', (e) => addFiles(Array.from(e.dataTransfer.files || [])));

    function addFiles(files) {
      const audio = files.filter((f) => /^audio\//.test(f.type) || /\.(mp3|wav|m4a|aac|flac|ogg|oga|opus)$/i.test(f.name));
      let added = 0;
      audio.forEach((file) => {
        if (items.some((it) => it.name === file.name && it.size === file.size)) return;
        items.push({
          id: Math.random().toString(36).slice(2, 10),
          file, name: file.name, size: file.size,
          status: 'ready', progress: 0,
          blob: null, url: null, outName: null, kbps: null, error: null
        });
        added++;
      });
      if (files.length && !audio.length) toast('오디오 파일만 추가할 수 있어요');
      else if (added) toast(added + '개 파일을 추가했어요');
      renderList();
    }

    function releaseItem(it) {
      if (it.url) URL.revokeObjectURL(it.url);
      it.url = null;
      it.blob = null;
    }

    function removeItem(id) {
      const it = items.find((x) => x.id === id);
      if (!it || it.status === 'converting') return;
      if (player.item === it) closePlayer();
      releaseItem(it);
      items = items.filter((x) => x !== it);
      renderList();
    }

    $('clear').addEventListener('click', () => {
      if (converting) return toast('변환이 끝난 뒤에 지울 수 있어요');
      closePlayer();
      items.forEach(releaseItem);
      items = [];
      renderList();
    });

    /* ---------- List rendering ---------- */
    function itemMeta(it) {
      if (it.status === 'done') {
        const diff = Math.round((1 - it.blob.size / it.size) * 100);
        const label = diff >= 0 ? '-' + diff + '%' : '+' + Math.abs(diff) + '%';
        return `<span class="badge ok">완료 ${label}</span><span>${fmtSize(it.size)} → ${fmtSize(it.blob.size)} · ${it.kbps}k</span>`;
      }
      if (it.status === 'converting') return `<span class="badge run">변환 중</span><span>${fmtSize(it.size)}</span>`;
      if (it.status === 'error') return `<span class="badge err">실패</span><span>${esc(it.error || '변환할 수 없는 파일')}</span>`;
      return `<span class="badge">대기</span><span>${fmtSize(it.size)}</span>`;
    }

    function renderList() {
      const list = $('list');
      $('count').textContent = items.length;
      $('empty').classList.toggle('hidden', items.length > 0);
      list.innerHTML = items.map((it) => `
        <div class="item${player.item === it ? ' active' : ''}" data-id="${it.id}">
          <div class="item-top">
            <div class="name" title="${esc(it.name)}">${esc(it.name)}</div>
            ${it.status === 'converting' ? '' : `<button class="x" data-act="remove" aria-label="삭제">${ICON_X}</button>`}
          </div>
          <div class="meta">${itemMeta(it)}</div>
          ${it.status === 'converting' ? `<div class="mini"><div id="mini-${it.id}" style="width:${Math.round(it.progress * 100)}%"></div></div>` : ''}
          ${it.status === 'done' ? `
          <div class="item-actions">
            <button class="btn soft" data-act="compare">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14v-2a9 9 0 0118 0v2"/><path d="M21 19a2 2 0 01-2 2h-1v-7h3v5zM3 19a2 2 0 002 2h1v-7H3v5z"/></svg>
              비교 듣기
            </button>
            <a class="btn soft" href="${it.url}" download="${esc(it.outName)}" style="text-decoration:none">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>
              WebM
            </a>
          </div>` : ''}
        </div>`).join('');
      updateButtons();
    }

    $('list').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const id = btn.closest('.item').dataset.id;
      if (btn.dataset.act === 'remove') removeItem(id);
      if (btn.dataset.act === 'compare') openPlayer(id);
    });

    function pending() {
      return items.filter((it) => it.status !== 'done' || it.kbps !== kbps);
    }

    function updateButtons() {
      const todo = pending().length;
      const done = items.filter((it) => it.status === 'done').length;
      const convertBtn = $('convert');
      convertBtn.disabled = converting || todo === 0;
      convertBtn.textContent = converting ? '변환 중…' : (todo ? `변환 시작 (${todo})` : '변환 시작');
      $('zip').disabled = converting || done === 0;
      $('clear').classList.toggle('hidden', items.length === 0);
    }

    /* ---------- Encoding ---------- */
    // OpusHead (RFC 7845) — used if the encoder doesn't provide one.
    function opusHead(channels, sampleRate) {
      const b = new Uint8Array(19);
      const v = new DataView(b.buffer);
      b.set([79, 112, 117, 115, 72, 101, 97, 100]); // "OpusHead"
      b[8] = 1; b[9] = channels;
      v.setUint16(10, 312, true);
      v.setUint32(12, sampleRate, true);
      return b;
    }

    let webCodecsOk = null;
    async function canUseWebCodecs(channels, bitrate) {
      if (!('AudioEncoder' in window) || !('AudioData' in window) || !window.WebMMuxer) return false;
      try {
        const r = await AudioEncoder.isConfigSupported({ codec: 'opus', sampleRate: 48000, numberOfChannels: channels, bitrate });
        return !!r.supported;
      } catch (e) { return false; }
    }

    // Faster-than-realtime encoding: WebCodecs Opus encoder + WebM muxer.
    async function encodeWebCodecs(buf, bitrate, onProgress) {
      const channels = Math.min(2, buf.numberOfChannels);
      const sampleRate = buf.sampleRate; // 48000 (decoded with an OfflineAudioContext @48k)
      const target = new WebMMuxer.ArrayBufferTarget();
      const muxer = new WebMMuxer.Muxer({
        target,
        audio: { codec: 'A_OPUS', sampleRate, numberOfChannels: channels },
        firstTimestampBehavior: 'offset'
      });

      let failure = null;
      const encoder = new AudioEncoder({
        output: (chunk, meta) => {
          if (meta && meta.decoderConfig && !meta.decoderConfig.description) {
            meta = { ...meta, decoderConfig: { ...meta.decoderConfig, description: opusHead(channels, sampleRate) } };
          }
          muxer.addAudioChunk(chunk, meta);
        },
        error: (e) => { failure = e; }
      });
      encoder.configure({ codec: 'opus', sampleRate, numberOfChannels: channels, bitrate });

      const data = [];
      for (let c = 0; c < channels; c++) data.push(buf.getChannelData(c));
      const total = buf.length;
      const FRAMES = 9600; // 200ms per AudioData

      for (let off = 0; off < total; off += FRAMES) {
        if (failure) throw failure;
        const n = Math.min(FRAMES, total - off);
        const planar = new Float32Array(n * channels);
        for (let c = 0; c < channels; c++) planar.set(data[c].subarray(off, off + n), c * n);
        const ad = new AudioData({
          format: 'f32-planar', sampleRate, numberOfFrames: n, numberOfChannels: channels,
          timestamp: Math.round(off * 1e6 / sampleRate), data: planar
        });
        encoder.encode(ad);
        ad.close();
        // Back-pressure + keep the UI responsive.
        while (encoder.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 0));
        if ((off / FRAMES) % 10 === 0) {
          onProgress(off / total);
          await new Promise((r) => setTimeout(r, 0));
        }
      }
      await encoder.flush();
      encoder.close();
      if (failure) throw failure;
      muxer.finalize();
      onProgress(1);
      return new Blob([target.buffer], { type: 'audio/webm' });
    }

    // Fallback: realtime MediaRecorder (only when WebCodecs is unavailable).
    function encodeRealtime(buf, bitrate, onProgress) {
      return new Promise((resolve, reject) => {
        const mime = ['audio/webm;codecs=opus', 'audio/webm'].find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
        if (!mime) return reject(new Error('이 브라우저는 WebM 인코딩을 지원하지 않아요'));
        const ac = audioCtx();
        const dest = ac.createMediaStreamDestination();
        const src = ac.createBufferSource();
        src.buffer = buf;
        src.connect(dest);
        const rec = new MediaRecorder(dest.stream, { mimeType: mime, audioBitsPerSecond: bitrate });
        const chunks = [];
        let timer = null;
        rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
        rec.onerror = (e) => { clearInterval(timer); reject(e.error || new Error('녹음 오류')); };
        rec.onstop = () => { clearInterval(timer); onProgress(1); resolve(new Blob(chunks, { type: 'audio/webm' })); };
        src.onended = () => setTimeout(() => { if (rec.state !== 'inactive') rec.stop(); }, 300);
        rec.start(500);
        const t0 = ac.currentTime;
        src.start();
        timer = setInterval(() => onProgress(Math.min(0.99, (ac.currentTime - t0) / buf.duration)), 250);
      });
    }

    async function decodeAt48k(file) {
      const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      const off = new OAC(2, 48000, 48000);
      return decodeWith(off, await file.arrayBuffer());
    }

    async function convertItem(it, bitrate, onProgress) {
      const buf = await decodeAt48k(it.file);
      const channels = Math.min(2, buf.numberOfChannels);
      if (webCodecsOk === null || webCodecsOk) {
        webCodecsOk = await canUseWebCodecs(channels, bitrate);
      }
      if (webCodecsOk) {
        try {
          return await encodeWebCodecs(buf, bitrate, onProgress);
        } catch (e) {
          console.warn('WebCodecs encode failed, falling back to realtime', e);
          webCodecsOk = false;
        }
      }
      return encodeRealtime(buf, bitrate, onProgress);
    }

    $('convert').addEventListener('click', async () => {
      if (converting) return;
      const queue = pending();
      if (!queue.length) return;
      audioCtx(); // unlock audio inside the tap (needed for the realtime fallback on iOS)

      converting = true;
      const bitrateKbps = kbps;
      const prog = $('progress');
      const bar = $('progress-bar');
      const text = $('progress-text');
      const pct = $('progress-pct');
      prog.classList.remove('hidden');

      const setOverall = (i, p) => {
        const v = Math.round(((i + p) / queue.length) * 100);
        bar.style.width = v + '%';
        pct.textContent = v + '%';
      };

      let ok = 0;
      for (let i = 0; i < queue.length; i++) {
        const it = queue[i];
        if (!items.includes(it)) continue;
        if (player.item === it) closePlayer();
        releaseItem(it);
        it.status = 'converting';
        it.progress = 0;
        it.error = null;
        renderList();
        text.textContent = `${i + 1}/${queue.length} · ${it.name}`;
        setOverall(i, 0);

        try {
          const blob = await convertItem(it, bitrateKbps * 1000, (p) => {
            it.progress = p;
            const mini = $('mini-' + it.id);
            if (mini) mini.style.width = Math.round(p * 100) + '%';
            setOverall(i, p);
          });
          if (!blob.size) throw new Error('빈 결과');
          it.blob = blob;
          it.url = URL.createObjectURL(blob);
          it.outName = `${baseName(it.name)}_${bitrateKbps}k.webm`;
          it.kbps = bitrateKbps;
          it.status = 'done';
          ok++;
        } catch (err) {
          console.error(err);
          it.status = 'error';
          it.error = (err && err.message && /[가-힣]/.test(err.message)) ? err.message : '디코딩/인코딩 실패';
        }
        setOverall(i, 1);
        renderList();
      }

      converting = false;
      text.textContent = `${ok}/${queue.length}개 변환 완료`;
      updateButtons();
      toast(ok === queue.length ? '변환이 끝났어요' : `${queue.length - ok}개 파일은 변환하지 못했어요`);
    });

    $('zip').addEventListener('click', async () => {
      const done = items.filter((it) => it.status === 'done');
      if (!done.length || !window.JSZip) return;
      const btn = $('zip');
      btn.disabled = true;
      try {
        const zip = new JSZip();
        const used = new Set();
        done.forEach((it) => {
          let name = it.outName;
          for (let n = 2; used.has(name); n++) name = it.outName.replace(/\.webm$/, ` (${n}).webm`);
          used.add(name);
          zip.file(name, it.blob);
        });
        const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
        download(blob, `cnation_webm_${done.length}files.zip`);
      } catch (e) {
        console.error(e);
        toast('ZIP을 만들지 못했어요');
      }
      btn.disabled = false;
      updateButtons();
    });

    /* ---------- Compare player ---------- */
    const SRC_NAME = { orig: '원본 MP3', conv: 'WebM' };
    const player = {
      item: null, orig: null, conv: null, duration: 0,
      which: 'conv', playing: false, loop: false,
      offset: 0, startedAt: 0, nodes: null, raf: 0, token: 0
    };
    // Alternating A/B: same section, original → WebM → original … until stopped.
    const alt = { on: false, len: 3, start: 0, segs: [], next: 0, n: 0, timer: 0 };
    const ALT_GAP = 0.25; // short silence between turns so the switch is noticeable

    function setPlayIcon(playing) {
      $('play-icon').innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
      $('play').setAttribute('aria-label', playing ? '정지' : '재생');
    }

    function renderAB() {
      document.querySelectorAll('#ab button').forEach((b) => b.classList.toggle('on', b.dataset.src === player.which));
    }

    function setNow(src, label, playing) {
      const now = $('now');
      now.className = 'now ' + (src || 'idle') + (playing ? ' playing' : '');
      $('now-src').textContent = SRC_NAME[src || player.which];
      $('now-label').textContent = label;
    }

    function position() {
      if (!player.playing) return player.offset;
      const t = ctx.currentTime - player.startedAt;
      return player.loop ? t % player.duration : Math.min(t, player.duration);
    }

    function stopNodes() {
      if (!player.nodes) return;
      player.nodes.forEach((n) => { n.src.onended = null; try { n.src.stop(); } catch (e) {} n.src.disconnect(); n.gain.disconnect(); });
      player.nodes = null;
    }

    function startNodes(offset) {
      const ac = audioCtx();
      stopNodes();
      const now = ac.currentTime + 0.03;
      player.nodes = ['orig', 'conv'].map((key) => {
        const src = ac.createBufferSource();
        const gain = ac.createGain();
        src.buffer = player[key];
        src.loop = player.loop;
        src.loopStart = 0;
        src.loopEnd = player.duration;
        gain.gain.value = player.which === key ? 1 : 0;
        src.connect(gain);
        gain.connect(ac.destination);
        src.start(now, offset);
        return { key, src, gain };
      });
      player.nodes[0].src.onended = () => {
        if (player.playing && !player.loop) { pause(); player.offset = 0; tick(); }
      };
      player.startedAt = now - offset;
    }

    function play() {
      if (!player.orig || !player.conv) return;
      stopAlt();
      if (player.offset >= player.duration - 0.05) player.offset = 0;
      startNodes(player.offset);
      player.playing = true;
      setPlayIcon(true);
      setNow(player.which, '재생 중', true);
      cancelAnimationFrame(player.raf);
      loopTick();
    }

    function pause() {
      if (!player.playing) return;
      player.offset = position();
      player.playing = false;
      stopNodes();
      setPlayIcon(false);
      setNow(null, '일시정지 · 여기서 번갈아 듣기 시작', false);
      cancelAnimationFrame(player.raf);
    }

    function seekTo(t) {
      player.offset = Math.max(0, Math.min(t, player.duration));
      if (player.playing) startNodes(player.offset);
      tick();
    }

    function switchTo(which) {
      if (alt.on) return;
      player.which = which;
      renderAB();
      if (player.playing) setNow(which, '재생 중', true);
      else setNow(null, $('now-label').textContent, false);
      if (player.nodes) {
        const t = ctx.currentTime;
        player.nodes.forEach((n) => {
          n.gain.gain.cancelScheduledValues(t);
          n.gain.gain.setValueAtTime(n.gain.gain.value, t);
          n.gain.gain.linearRampToValueAtTime(n.key === which ? 1 : 0, t + 0.015);
        });
      }
    }

    /* --- alternating playback --- */
    function scheduleAlt() {
      const ac = ctx;
      while (alt.next < ac.currentTime + 1.5) {
        const key = alt.n % 2 === 0 ? 'orig' : 'conv';
        const t0 = alt.next;
        const t1 = t0 + alt.len;
        const src = ac.createBufferSource();
        const g = ac.createGain();
        src.buffer = player[key];
        g.gain.setValueAtTime(0, t0);
        g.gain.linearRampToValueAtTime(1, t0 + 0.012);
        g.gain.setValueAtTime(1, t1 - 0.025);
        g.gain.linearRampToValueAtTime(0, t1);
        src.connect(g);
        g.connect(ac.destination);
        src.start(t0, alt.start, alt.len);
        src.stop(t1 + 0.05);
        alt.segs.push({ key, t0, t1, n: alt.n, src, g });
        alt.n++;
        alt.next = t1 + ALT_GAP;
      }
      // Drop finished segments.
      alt.segs = alt.segs.filter((s) => {
        if (s.t1 < ac.currentTime - 0.5) { s.src.disconnect(); s.g.disconnect(); return false; }
        return true;
      });
    }

    function startAlt(len) {
      if (!player.orig || !player.conv) return;
      audioCtx();
      const start = player.playing ? position() : player.offset;
      if (player.playing) pause();
      stopAlt();
      alt.len = Math.min(len, player.duration);
      alt.start = Math.max(0, Math.min(start, player.duration - alt.len));
      alt.n = 0;
      alt.segs = [];
      alt.next = ctx.currentTime + 0.08;
      alt.on = true;
      scheduleAlt();
      alt.timer = setInterval(scheduleAlt, 250);

      const seek = $('seek');
      seek.style.setProperty('--rs', (alt.start / player.duration * 100) + '%');
      seek.style.setProperty('--re', ((alt.start + alt.len) / player.duration * 100) + '%');
      document.querySelectorAll('#alt-btns button').forEach((b) => b.classList.toggle('on', Number(b.dataset.len) === len));
      $('ab').classList.add('locked');
      $('now-side').classList.remove('hidden');
      $('seg-bar').classList.remove('hidden');
      $('now-range').textContent = `${fmtTime(alt.start)}–${fmtTime(alt.start + alt.len)}`;
      $('alt-hint').textContent = '같은 구간 반복 중 · 다시 누르면 정지';
      setPlayIcon(true);
      cancelAnimationFrame(player.raf);
      altTick();
    }

    function stopAlt() {
      if (!alt.on) return;
      alt.on = false;
      clearInterval(alt.timer);
      alt.segs.forEach((s) => { try { s.src.stop(); } catch (e) {} s.src.disconnect(); s.g.disconnect(); });
      alt.segs = [];
      player.offset = alt.start;
      cancelAnimationFrame(player.raf);
      const seek = $('seek');
      seek.style.setProperty('--rs', '0%');
      seek.style.setProperty('--re', '0%');
      document.querySelectorAll('#alt-btns button').forEach((b) => b.classList.remove('on'));
      $('ab').classList.remove('locked');
      $('now-side').classList.add('hidden');
      $('seg-bar').classList.add('hidden');
      $('alt-hint').textContent = '시작 위치를 정하고 구간 길이를 누르세요';
      setPlayIcon(false);
      setNow(null, '일시정지 · 여기서 번갈아 듣기 시작', false);
      tick();
    }

    function altTick() {
      if (!alt.on) return;
      const now = ctx.currentTime;
      // Current segment, or the next one during the short gap.
      const cur = alt.segs.find((s) => now >= s.t0 && now < s.t1) || alt.segs.find((s) => s.t0 > now);
      if (cur) {
        const playingNow = now >= cur.t0;
        const elapsed = playingNow ? now - cur.t0 : 0;
        setNow(cur.key, playingNow ? `지금 재생 중 · ${alt.len}초 구간` : '다음 차례', playingNow);
        $('now-round').textContent = `${Math.floor(cur.n / 2) + 1}회차`;
        $('seg-bar').classList.toggle('orig', cur.key === 'orig');
        $('seg-fill').style.width = (elapsed / alt.len * 100) + '%';
        player.which = cur.key;
        renderAB();
        showPos(alt.start + elapsed);
      }
      player.raf = requestAnimationFrame(altTick);
    }

    let seeking = false;
    function showPos(pos) {
      $('cur').textContent = fmtTime(pos);
      if (!seeking) {
        const seek = $('seek');
        seek.value = player.duration ? Math.round((pos / player.duration) * 1000) : 0;
        seek.style.setProperty('--p', (seek.value / 10) + '%');
      }
    }
    function tick() { showPos(position()); }
    function loopTick() {
      tick();
      if (player.playing) player.raf = requestAnimationFrame(loopTick);
    }

    async function openPlayer(id) {
      const it = items.find((x) => x.id === id);
      if (!it || it.status !== 'done') return;
      audioCtx(); // unlock within tap
      pause();
      stopAlt();
      const token = ++player.token;
      Object.assign(player, { item: it, orig: null, conv: null, duration: 0, offset: 0 });
      $('player').classList.remove('hidden');
      $('pl-name').textContent = it.name;
      $('ab-orig').textContent = fmtSize(it.size);
      $('ab-conv').textContent = `${fmtSize(it.blob.size)} · ${it.kbps}k`;
      $('cur').textContent = '0:00';
      $('dur').textContent = '…';
      $('play').disabled = true;
      setNow(null, '불러오는 중…', false);
      renderAB();
      renderList();

      try {
        const [orig, conv] = await Promise.all([
          it.file.arrayBuffer().then((b) => decodeWith(ctx, b)),
          it.blob.arrayBuffer().then((b) => decodeWith(ctx, b))
        ]);
        if (token !== player.token) return;
        player.orig = orig;
        player.conv = conv;
        player.duration = Math.min(orig.duration, conv.duration);
        $('dur').textContent = fmtTime(player.duration);
        $('play').disabled = false;
        tick();
        play();
      } catch (e) {
        console.error(e);
        if (token !== player.token) return;
        toast('이 브라우저에서는 WebM을 재생할 수 없어요');
        closePlayer();
      }
    }

    function closePlayer() {
      pause();
      stopAlt();
      player.token++;
      Object.assign(player, { item: null, orig: null, conv: null, duration: 0, offset: 0 });
      $('player').classList.add('hidden');
      renderList();
    }

    $('play').addEventListener('click', () => {
      audioCtx();
      if (alt.on) return stopAlt();
      player.playing ? pause() : play();
    });
    $('pl-close').addEventListener('click', closePlayer);
    $('ab').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (b) switchTo(b.dataset.src);
    });
    $('alt-btns').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      const len = Number(b.dataset.len);
      if (alt.on && alt.len === Math.min(len, player.duration) && b.classList.contains('on')) stopAlt();
      else startAlt(len);
    });
    $('loop').addEventListener('click', () => {
      player.loop = !player.loop;
      $('loop').classList.toggle('on', player.loop);
      if (player.nodes) player.nodes.forEach((n) => { n.src.loop = player.loop; });
      if (player.playing && !player.loop) {
        // Re-anchor so the remaining time is measured from the current position.
        startNodes(position());
      }
    });
    const seek = $('seek');
    seek.addEventListener('input', () => {
      seeking = true;
      seek.style.setProperty('--p', (seek.value / 10) + '%');
      $('cur').textContent = fmtTime((seek.value / 1000) * player.duration);
    });
    seek.addEventListener('change', () => {
      seeking = false;
      const t = (seek.value / 1000) * player.duration;
      if (alt.on) {
        // Move the comparison section to the new spot and keep alternating.
        const len = alt.len;
        stopAlt();
        player.offset = t;
        startAlt(len);
      } else {
        seekTo(t);
      }
    });

    window.addEventListener('keydown', (e) => {
      if (!player.orig || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
      if (e.code === 'Space') {
        e.preventDefault();
        if (alt.on) stopAlt(); else player.playing ? pause() : play();
      }
      if (e.key === 'a' || e.key === 'A') switchTo('orig');
      if (e.key === 'b' || e.key === 'B') switchTo('conv');
      if (e.key === '3' || e.key === '5') startAlt(Number(e.key));
      if (e.key === '0') startAlt(10);
    });

    renderBitrate();
    renderList();
  })();
  </script>
</body>
</html>
